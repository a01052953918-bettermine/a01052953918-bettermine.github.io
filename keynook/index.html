<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키눅 · KeyNook</title>
<meta name="description" content="키눅 — 계정정보 등록·보관기. 이 브라우저에서만 암호화되는 개인용 계정 금고 프로토타입.">
<link rel="stylesheet" href="styles.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- Auth (lock / create) -->
<section id="view-auth">
  <div class="auth-card">
    <div class="brand-lockup">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a56a1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
        <div class="brand-title serif">키눅</div>
        <div class="brand-sub mono">KEYNOOK</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div id="auth-title" style="font-size:15px;color:var(--ink-dim);"></div>
      <div id="auth-sub" style="font-size:12px;color:var(--ink-faint);text-align:center;max-width:300px;"></div>
    </div>

    <form id="auth-form" class="auth-form">
      <input type="password" id="auth-password" placeholder="마스터 비밀번호" autocomplete="current-password" required>
      <div id="auth-confirm-field" class="hidden">
        <input type="password" id="auth-confirm" placeholder="비밀번호 확인" autocomplete="new-password">
      </div>
      <div id="auth-error" class="auth-error"></div>
      <button type="submit" id="auth-submit" class="btn-primary">잠금 해제</button>
    </form>

    <div id="auth-import-row" class="hidden" style="text-align:center;">
      <label class="btn-icon" style="display:inline-flex;">기존 백업 파일 가져오기<input type="file" id="auth-import-input" accept="application/json" class="hidden"></label>
    </div>

    <div class="auth-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px;"><path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4Z"></path></svg>
      <span>이 정보는 이 브라우저에만 암호화되어 저장됩니다. 서버로 전송되지 않습니다.</span>
    </div>
    <div class="auth-disclaimer">동작 프로토타입입니다 — 보안 감사를 거치지 않았으니 실제 중요 계정 정보 등록은 권장하지 않습니다.</div>
  </div>
</section>

<!-- Main app -->
<section id="view-app" class="hidden">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a56a1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></div>
      <div class="sidebar-brand-text"><span class="name serif">키눅</span><span class="sub mono">KEYNOOK</span></div>
    </div>
    <nav class="nav-list" id="nav-list"></nav>
    <div class="sidebar-foot">
      <div class="backup-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3d6350" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
        <div><span class="label">마지막 백업</span><span class="value" id="sidebar-backup-value">-</span></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search-input">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="text" id="search-input" placeholder="서비스 또는 계정 검색">
      </div>
      <div class="spacer"></div>
      <button class="btn-icon" id="btn-backup-nav">백업</button>
      <button class="btn-icon accent" id="btn-add-account">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        계정 등록
      </button>
      <button class="btn-icon" id="btn-lock" title="잠그기">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      </button>
    </div>
    <div class="content" id="content-area"></div>
  </main>
</section>

<!-- Account modal -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">새 계정 등록</h2>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <form id="account-form" style="display:flex;flex-direction:column;gap:16px;">
      <div class="field">
        <label>서비스명</label>
        <input type="text" id="f-service" placeholder="예: Gmail, 국민은행" required>
      </div>
      <div class="field">
        <label>카테고리</label>
        <div class="pill-row" id="category-pills"></div>
      </div>
      <div class="warn-box hidden" id="finance-note">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c07c1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <div><strong>금융·정부 계정은 저장 위치만 기록하는 것을 권장합니다.</strong><br>비밀번호·인증코드는 저장 대상에서 제외됩니다.</div>
      </div>
      <div class="field">
        <label>계정 ID / 이메일</label>
        <input type="text" id="f-username" placeholder="아이디 또는 이메일">
      </div>
      <div class="field" id="password-field">
        <label>비밀번호</label>
        <input type="text" id="f-password" placeholder="비밀번호" autocomplete="off">
      </div>
      <div class="field">
        <label>바로가기 URL <span style="font-weight:400;color:var(--ink-faint);">(선택 · 실행 버튼에 사용)</span></label>
        <input type="text" id="f-url" placeholder="https://...">
      </div>
      <div class="field" id="codes-field">
        <label>2차 인증 백업코드 <span style="font-weight:400;color:var(--ink-faint);">(선택)</span></label>
        <textarea id="f-codes" placeholder="복구코드를 붙여넣으세요"></textarea>
      </div>
      <div class="field">
        <label>메모</label>
        <textarea id="f-memo" placeholder="선택 입력"></textarea>
      </div>
      <div class="field">
        <label>중요도</label>
        <div class="pill-row" id="tier-pills"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="modal-cancel">취소</button>
        <button type="submit" class="btn-primary" style="flex:2;">저장</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js" defer></script>
</body>
</html>
